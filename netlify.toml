# Netlify deployment.
#
# Read docs/DEPLOY-SUPABASE-NETLIFY.md before relying on this. Netlify runs the
# app and Supabase holds the database; the one thing this pairing cannot do is
# keep a connection open for a whole lesson, so server-sent events are cut and
# the client falls back to 20-second polling. Nothing is lost, only liveness.

[build]
  command = "pnpm prisma generate && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Never set BUILD_STANDALONE here — it breaks Netlify's Next.js runtime.

# Installed automatically by Netlify when a Next.js app is detected, but pinned
# explicitly so a detection change cannot silently alter the deploy.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The two nightly jobs. Netlify has no cron service, so the schedules live in
# the function files themselves (`export const config = { schedule: ... }`).
[functions]
  directory = "netlify/functions"
